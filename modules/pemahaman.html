function say(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ms-MY";u.volume=1;speechSynthesis.speak(u)}catch(e){}}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1200)}function nav(){nav.innerHTML=Object.entries(WORLDS).map(([k,v])=>`<button class="wb" onclick="start('${k}')"><b>World ${k}</b><br>${v.name}</button>`).join("")}function start(w){world=w;idx=0;score=0;answered=false;render()}

function mcq(i){if(answered)return;answered=true;let q=DATA[world][idx],ok=i===q.a;if(ok)score++;let t=ok?P[idx%P.length]:"Belum tepat. Semak bukti dalam bahan.";toast(t);say(t);fb.innerHTML=`<div class="fb"><b>${ok?"Betul / 答对":"Belum tepat / 还不对"}</b><p>${q.e}</p><p><b>华语：</b>${q.zh}</p><p><b>Jawapan:</b> ${q.model}</p><button class="btn" onclick="next()">Seterusnya</button></div>`}

function selfScore(){score++;next()}function next(){if(idx<29){idx++;answered=false;render()}else finish()}function grade(p){return p>=90?"A":p>=80?"B":p>=70?"C":p>=60?"D":p>=50?"E":"F"}function finish(){let p=Math.round(score/30*100);app.innerHTML=`<div class="card"><h2>World ${world} selesai</h2><div class="grade">${grade(p)}</div><h3>${score}/30 · ${p}%</h3><p>Nota: Untuk SRT/KBAT, angka ini menunjukkan latihan yang telah disemak sendiri, bukan markah guru automatik.</p><button class="btn" onclick="start(world)">Ulang World</button></div>`}nav();render();
